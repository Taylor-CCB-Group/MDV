apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Lets you jump from a log line that carries a trace ID to the trace.
      derivedFields:
        - name: trace_id
          matcherRegex: '(?:trace_id|traceID|trace_id=)[=:"\s]*([0-9a-f]{32})'
          datasourceUid: tempo
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      # Server log streams carry no service label, so find a span's logs by the
      # trace ID that MDV writes into each log line.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{container=~".+"} |= "$${__trace.traceId}"'
      streamingEnabled:
        search: true
        metrics: true
