# Most metrics arrive by remote write from Alloy and Tempo. Prometheus only
# scrapes the stack itself, so you can see when the stack is unhealthy.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
