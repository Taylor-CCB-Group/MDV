name: Prepare release

# Opens a release PR every 4 months. Merging that PR starts release.yml, which publishes
# to TestPyPI, smoke-tests the upload, waits for approval, then publishes to PyPI.
# While the PR is open, each push to main is merged into it (the sync job).
on:
  push:
    branches:
      - main
  schedule:
    # 09:00 UTC on 1 February, 1 June and 1 October
    - cron: "0 9 1 2,6,10 *"
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Skip when nothing has merged since the last release
        id: changes
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          if [ -z "$(git log "$last_tag"..HEAD --oneline)" ]; then
            echo "No commits since $last_tag, so there is nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: steps.changes.outputs.skip != 'true'
        with:
          working-directory: python

      - name: Bump the version and date the changelog
        if: steps.changes.outputs.skip != 'true'
        id: version
        env:
          BUMP: ${{ inputs.bump || 'minor' }}
          LAST_TAG: ${{ steps.changes.outputs.last_tag }}
        run: |
          current=$(python3 .github/scripts/release.py current)
          # GitHub's PR list fills an empty [Unreleased]; the reviewer rewrites it.
          # The v-next tag does not exist, so GitHub needs the commit to end the list at.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v-next" -f target_commitish="$GITHUB_SHA" -f previous_tag_name="$LAST_TAG" \
            --jq .body | sed -e "s/^## What's Changed$/### To rewrite/" -e 's/^## /### /' \
            -e '/^\*\*Full Changelog\*\*/d' > "$RUNNER_TEMP/notes.md"
          # updates the version in pyproject.toml and uv.lock
          (cd python && uv version --bump "$BUMP" --no-sync)
          version=$(python3 .github/scripts/release.py changelog \
            --previous "$current" --fallback-notes "$RUNNER_TEMP/notes.md")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open the release PR
        if: steps.changes.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          branch="release/v$VERSION"
          # an existing branch may hold a maintainer's edits, so never push over it
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            if [ "$(gh pr list --state open --base main --head "$branch" --json number --jq length)" != "0" ]; then
              echo "::notice::$branch already has an open release PR, so this run leaves it alone."
              exit 0
            fi
            # an earlier run pushed the branch but could not open the PR
            echo "::notice::$branch exists without an open PR, so this run opens one for it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git commit -am "Release $VERSION"
            git push origin "$branch"
          fi
          gh pr create --base main --head "$branch" --title "Release $VERSION" --body-file - <<EOF
          This PR bumps \`mdvtools\` from $CURRENT to $VERSION and dates the changelog.

          Before you merge it:

          1. Edit the \`[$VERSION]\` section of \`CHANGELOG.md\` so it describes the release for users.
             Rewrite any pull request titles under \`### To rewrite\` into \`Added\`, \`Changed\` or \`Fixed\` entries, then delete the heading. The Release workflow stops while that heading is there.
          2. Change the version if this release needs a different bump.
          3. Approve the waiting CI runs on this PR. GitHub holds checks on a PR that a workflow opened until someone with write access approves them.
          4. Each PR that merges into \`main\` before this one is merged into this branch, and its title is added under \`### To rewrite\`. Rewrite those too. If the merge conflicts, the workflow comments here instead, and someone has to merge \`main\` into this branch by hand.

          Merging starts the Release workflow, which publishes to TestPyPI, tests the upload and waits for approval before it publishes to PyPI.
          EOF

  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-sync
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge main into the open release PR and list the new PRs
        run: |
          pr=$(gh pr list --state open --base main --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/v"))][0] // empty | "\(.number) \(.headRefName)"')
          if [ -z "$pr" ]; then
            echo "No release PR is open, so there is nothing to update."
            exit 0
          fi
          read -r number branch <<< "$pr"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch "$branch"
          version=$(python3 .github/scripts/release.py current)

          # one line per change, oldest first; a commit pushed straight to main has no PR
          : > "$RUNNER_TEMP/entries.md"
          for sha in $(git log --first-parent --reverse --format=%H "$branch"..origin/main); do
            entry=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq '[.[] | select(.merged_at != null)][0] // empty | "- \(.title) (#\(.number))"')
            [ -n "$entry" ] || entry="- $(git log -1 --format=%s "$sha") (${sha:0:8})"
            echo "$entry" >> "$RUNNER_TEMP/entries.md"
          done
          if [ ! -s "$RUNNER_TEMP/entries.md" ]; then
            echo "$branch already has everything on main."
            exit 0
          fi

          if ! git merge --no-edit origin/main; then
            git merge --abort
            {
              echo "Merging \`main\` into \`$branch\` conflicts, so the workflow could not add these changes to the \`[$version]\` section of the changelog. Merge \`main\` into this branch by hand, resolve the conflicts and add entries for them:"
              echo
              cat "$RUNNER_TEMP/entries.md"
            } | gh pr comment "$number" --body-file -
            exit 1
          fi
          python3 .github/scripts/release.py to-rewrite "$version" "$RUNNER_TEMP/entries.md"
          git commit -am "List the changes merged into main in the $version changelog"
          git push origin "$branch"
