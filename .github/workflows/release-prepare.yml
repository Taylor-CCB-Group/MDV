name: Prepare release

# Opens a release PR every 4 months. Merging that PR starts release.yml, which publishes
# to TestPyPI, smoke-tests the upload, waits for approval, then publishes to PyPI.
on:
  schedule:
    # 09:00 UTC on 1 February, 1 June and 1 October
    - cron: "0 9 1 2,6,10 *"
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Skip when nothing has merged since the last release
        id: changes
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          if [ -z "$(git log "$last_tag"..HEAD --oneline)" ]; then
            echo "No commits since $last_tag, so there is nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: steps.changes.outputs.skip != 'true'
        with:
          working-directory: python

      - name: Bump the version and date the changelog
        if: steps.changes.outputs.skip != 'true'
        id: version
        env:
          BUMP: ${{ inputs.bump || 'minor' }}
          LAST_TAG: ${{ steps.changes.outputs.last_tag }}
        run: |
          current=$(python3 .github/scripts/release.py current)
          # GitHub's PR list fills an empty [Unreleased]; the reviewer rewrites it.
          # The v-next tag does not exist, so GitHub needs the commit to end the list at.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v-next" -f target_commitish="$GITHUB_SHA" -f previous_tag_name="$LAST_TAG" \
            --jq .body | sed -e 's/^## /### /' -e '/^\*\*Full Changelog\*\*/d' > "$RUNNER_TEMP/notes.md"
          # updates the version in pyproject.toml and uv.lock
          (cd python && uv version --bump "$BUMP" --no-sync)
          version=$(python3 .github/scripts/release.py changelog \
            --previous "$current" --fallback-notes "$RUNNER_TEMP/notes.md")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open the release PR
        if: steps.changes.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Release $VERSION"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "Release $VERSION" --body-file - <<EOF
          This PR bumps \`mdvtools\` from $CURRENT to $VERSION and dates the changelog.

          Before you merge it:

          1. Edit the \`[$VERSION]\` section of \`CHANGELOG.md\` so it describes the release for users.
             If it lists pull request titles, nobody filled in \`[Unreleased]\`, so rewrite them.
          2. Change the version if this release needs a different bump.
          3. Approve the waiting CI runs on this PR. GitHub holds checks on a PR that a workflow opened until someone with write access approves them.

          Merging starts the Release workflow, which publishes to TestPyPI, tests the upload and waits for approval before it publishes to PyPI.
          EOF
          fi
