name: TypeScript/JS CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Called by pull-request-image.yml.
  workflow_call:

concurrency:
  # A called run sees the caller's github.workflow, so the literal keeps it
  # from cancelling the caller or the Python run beside it.
  group: ${{ github.workflow }}-typescript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run vite-build
      - run: pnpm run test
      # - uses: icrawl/action-tsc@v1
