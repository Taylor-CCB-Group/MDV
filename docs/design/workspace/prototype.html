<!-- The MDV workspace prototype: the reference for the workspace redesign (see README.md and HANDOVER.md). Throwaway sample data, no server. Open this file in a browser. -->
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MDV Workspace Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a Sheets/Photoshop-style workspace. App bar + menus, a toolbar that acts on the selection,
   a filter bar, a tool rail | a snapping 12-column canvas | a docked inspector, then view tabs + status bar. */
:root{
  --bg:#e5e8ee; --chrome:#ffffff; --canvas:#f1f3f7; --dot:#d6dbe3; --surface:#ffffff; --surface-2:#f4f6f9; --hover:#edf0f5;
  --border:#e1e5eb; --border-strong:#c9cfd9; --fg:#17202b; --muted:#5b6575; --faint:#8a93a2;
  --accent:#2563eb; --accent-strong:#1d4fd8; --accent-soft:rgba(37,99,235,.10); --accent-line:rgba(37,99,235,.45); --accent-fg:#ffffff;
  --plot:#ffffff; --gridline:#edf0f4; --axis:#8a93a2; --ghost:rgba(110,120,135,.16);
  --danger:#cc3a3a; --warn:#a8670f; --ok:#2c7a4b;
  --shadow-1:0 1px 2px rgba(16,24,40,.06); --shadow-2:0 10px 28px rgba(16,24,40,.14),0 2px 6px rgba(16,24,40,.06);
  --proto-bg:#111418; --proto-fg:#f2f4f7;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08090c; --chrome:#14171d; --canvas:#0d0f13; --dot:#1f232b; --surface:#171a21; --surface-2:#1e222a; --hover:#232832;
  --border:#262b34; --border-strong:#363c48; --fg:#e6e9ef; --muted:#9ba3b2; --faint:#6c7483;
  --accent:#6f9dff; --accent-strong:#8db1ff; --accent-soft:rgba(111,157,255,.14); --accent-line:rgba(111,157,255,.5); --accent-fg:#0a1330;
  --plot:#101217; --gridline:#1c2028; --axis:#6c7483; --ghost:rgba(150,160,175,.10);
  --danger:#ff7676; --warn:#f0b45a; --ok:#5ccf8f;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 12px 32px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
  --proto-bg:#f2f4f7; --proto-fg:#111418; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090c; --chrome:#14171d; --canvas:#0d0f13; --dot:#1f232b; --surface:#171a21; --surface-2:#1e222a; --hover:#232832;
  --border:#262b34; --border-strong:#363c48; --fg:#e6e9ef; --muted:#9ba3b2; --faint:#6c7483;
  --accent:#6f9dff; --accent-strong:#8db1ff; --accent-soft:rgba(111,157,255,.14); --accent-line:rgba(111,157,255,.5); --accent-fg:#0a1330;
  --plot:#101217; --gridline:#1c2028; --axis:#6c7483; --ghost:rgba(150,160,175,.10);
  --danger:#ff7676; --warn:#f0b45a; --ok:#5ccf8f;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 12px 32px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
  --proto-bg:#f2f4f7; --proto-fg:#111418; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 76px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:15px;height:15px}
kbd{font:11px var(--mono);color:var(--faint);padding:1px 5px;border:1px solid var(--border);border-radius:4px;background:var(--surface-2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app frame ---------- */
.app{container:app/inline-size;position:relative;max-width:var(--frame-w,100%);margin:0 auto;height:clamp(600px,calc(100dvh - 104px),1040px);
  display:flex;flex-direction:column;background:var(--chrome);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-2);
  transition:max-width .25s ease;user-select:none;-webkit-user-select:none}
.app input,.app textarea,.textbox,.tbl{user-select:text;-webkit-user-select:text}
@media (max-width:640px){
  body{padding-block:10px 118px}
  .app{height:max(560px,calc(100dvh - 140px))}
  .proto .tag{display:none}
  .proto{gap:4px;padding:5px}
}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib.sm{width:26px;height:26px;border-radius:6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.primary:hover{background:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.danger{color:var(--danger)}
.sep{width:1px;height:20px;background:var(--border);flex:none;margin:0 4px}

/* app bar: title row + menu row, as in Sheets */
.appbar{position:relative;display:flex;align-items:center;gap:10px;padding:8px 12px 2px}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font:700 11px/1 var(--font);letter-spacing:.04em;flex:none}
.titleblock{display:flex;flex-direction:column;min-width:0;flex:1}
.titlerow{display:flex;align-items:center;gap:8px;min-width:0}
.ptitle{min-width:0;max-width:60ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:600;padding:1px 6px;border:1px solid transparent;border-radius:6px;background:none;text-align:left}
.ptitle:hover{border-color:var(--border)}
.saved{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;white-space:nowrap}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.saved.dirty i{background:var(--warn)}
.menubar{display:flex;gap:1px;margin-left:-2px}
.menubar button{border:0;background:none;padding:2px 8px;border-radius:6px;font-size:13px;color:var(--fg)}
.menubar button:hover,.menubar button[aria-expanded="true"]{background:var(--hover)}
.menu-btn{display:none!important}
.appbar .right{display:flex;align-items:center;gap:6px;flex:none}
.searchbtn{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);min-width:230px}
.searchbtn:hover{border-color:var(--border-strong)}
.searchbtn kbd{margin-left:auto}
.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#7c5cc4;color:#fff;font-weight:600;font-size:12px;border:0}

/* toolbar acting on the selection, as in Sheets/Excel */
.toolbar{display:flex;align-items:center;gap:2px;margin:6px 10px 8px;padding:3px 6px;background:var(--surface-2);border-radius:12px;overflow-x:auto;scrollbar-width:none;min-height:40px}
.toolbar::-webkit-scrollbar{display:none}
.toolbar .btn{height:30px}
.ctx{display:flex;align-items:center;gap:6px;min-width:0}
.ctx-type{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap;padding:0 4px}
.tb-hint{color:var(--faint);font-size:12px;white-space:nowrap;padding:0 6px}
.tsel{position:relative;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 26px 0 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);white-space:nowrap}
.tsel:hover{border-color:var(--border-strong)}
.tsel-l{color:var(--faint);font-size:12px}
.tsel select{appearance:none;border:0;background:transparent;outline:0;font-weight:500;max-width:150px;cursor:pointer}
.tsel select option{background:var(--surface);color:var(--fg)}
.tsel .i{position:absolute;right:6px;width:14px;height:14px;color:var(--faint);pointer-events:none}
.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:2px}

/* filter bar, in the place of the formula bar */
.filterbar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);min-height:42px;position:relative}
.fb-label{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;color:var(--muted);padding-right:8px;border-right:1px solid var(--border);flex:none}
.fb-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;align-items:center}
.fb-chips::-webkit-scrollbar{display:none}
.fb-empty{color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:999px;border:1px solid var(--accent-line);background:var(--accent-soft);white-space:nowrap;cursor:pointer;font-size:12.5px}
.chip:hover{border-color:var(--accent)}
.chip.on{box-shadow:0 0 0 2px var(--accent-line)}
.chip-ds{font:11px var(--mono);color:var(--accent);text-transform:lowercase}
.chip-x{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:var(--muted)}
.chip-x:hover{background:var(--surface);color:var(--fg)}

/* body: rail | canvas | inspector */
.body{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;background:var(--canvas);overflow:hidden}
.rail{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;background:var(--chrome);border-right:1px solid var(--border);z-index:6}
.rail .ib{width:36px;height:36px}
.rail-sep{width:22px;height:1px;background:var(--border);margin:4px 0}
[data-tip]{position:relative}
@media (hover:hover){
  [data-tip]:hover::after{content:attr(data-tip);position:absolute;z-index:60;left:calc(100% + 8px);top:50%;translate:0 -50%;white-space:nowrap;
    padding:5px 8px;border-radius:6px;background:var(--fg);color:var(--chrome);font-size:12px;pointer-events:none}
}
.canvas-wrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.canvas{flex:1;overflow:auto;scrollbar-gutter:stable;position:relative;
  background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px}
.grid{position:relative;min-height:100%}
.guides{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .15s}
.grid.moving .guides{opacity:1}
.guides span{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.layout-info{display:flex;align-items:center;gap:8px;padding:4px 12px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--border);background:var(--chrome);white-space:nowrap;overflow:hidden}
.layout-info b{color:var(--muted);font-weight:500}
.layout-info .link{border:0;background:none;color:var(--accent);padding:0;font-size:11.5px}

/* chart cards */
.card{position:absolute;left:0;top:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow-1);overflow:hidden;container:card/inline-size;
  transition:transform .2s cubic-bezier(.2,.7,.3,1),width .2s cubic-bezier(.2,.7,.3,1),height .2s cubic-bezier(.2,.7,.3,1),box-shadow .15s,border-color .15s}
.card:hover{border-color:var(--border-strong)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-1)}
.card.lift{transition:none;z-index:20;box-shadow:var(--shadow-2);opacity:.96}
.card.max{z-index:30;transition:none}
.grid.has-max .card:not(.max){visibility:hidden}
.card-head{display:flex;align-items:center;gap:6px;height:36px;padding:0 4px 0 8px;border-bottom:1px solid var(--border);cursor:grab;user-select:none;touch-action:none;flex:none}
.card.locked .card-head{cursor:default}
.card-head .ti{color:var(--faint)}
.card-head h3{margin:0;font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds{font:11px var(--mono);color:var(--muted);padding:1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.fpill{display:none;align-items:center;gap:4px;height:22px;padding:0 4px 0 8px;border-radius:999px;border:0;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:500;white-space:nowrap}
.card.filtering .fpill{display:inline-flex}
.fpill .i{width:13px;height:13px}
.lockmark{display:none;color:var(--faint)}
.card.locked .lockmark{display:inline-flex}
.acts{display:flex;align-items:center}
@media (hover:hover){.card:not(:hover):not(.sel) .acts .opt{opacity:0}}
@container card (max-width:320px){.card .ds,.card .acts .opt-max{display:none}}
@container card (max-width:240px){.card .fpill .lbl{display:none}}
.card-body{position:relative;flex:1;min-height:0;background:var(--plot)}
.card-body canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.selov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.selov path,.selov rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
.tool-select .card-body canvas.scatter,.tool-lasso .card-body canvas.scatter{cursor:crosshair}
.tool-pan .card-body canvas.scatter{cursor:grab}
.tool-zoom .card-body canvas.scatter{cursor:zoom-in}
canvas.hist{cursor:ew-resize} canvas.row{cursor:pointer}
.legend{position:absolute;top:8px;right:8px;max-height:calc(100% - 44px);overflow:auto;padding:6px 8px;border-radius:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  border:1px solid var(--border);font-size:11.5px;display:flex;flex-direction:column;gap:2px;max-width:46%;backdrop-filter:blur(4px)}
.legend .lg-b{display:flex;flex-direction:column;gap:2px}
.legend .lg-b div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend span{overflow:hidden;text-overflow:ellipsis}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend em{margin-left:auto;font-style:normal;color:var(--faint);font-variant-numeric:tabular-nums;padding-left:8px}
.legend .lg-h{display:none;align-items:center;gap:4px;border:0;background:none;padding:0;font-weight:600;color:var(--muted);font-size:11.5px}
@container card (max-width:360px){
  .legend{max-width:72%;padding:4px 8px}
  .legend .lg-h{display:flex}
  .legend:not(.open) .lg-b{display:none}
}
.rz{position:absolute;z-index:4;touch-action:none}
.rz-e{right:0;top:36px;bottom:12px;width:9px;cursor:ew-resize}
.rz-s{bottom:0;left:12px;right:12px;height:9px;cursor:ns-resize}
.rz-se{right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}
.card.sel .rz-se::after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);border-radius:0 0 3px 0}
.card.locked .rz{display:none}
.ph{position:absolute;left:0;top:0;border-radius:var(--r);background:var(--accent-soft);border:1.5px dashed var(--accent);pointer-events:none;
  transition:transform .12s ease,width .12s ease,height .12s ease;opacity:0}
.grid.moving .ph{opacity:1}
.tbl{position:absolute;inset:0;overflow:auto;font-size:12px}
.tbl table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:5px 10px;border-bottom:1px solid var(--gridline);white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr:hover td{background:var(--hover)}
.tbl .foot{position:sticky;bottom:0;padding:6px 10px;background:var(--surface-2);border-top:1px solid var(--border);color:var(--muted)}
.textbox{position:absolute;inset:0;overflow:auto;padding:12px 16px;background:var(--surface)}
.textbox h2{margin:0 0 6px;font-size:clamp(16px,2.4cqi,22px);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.textbox p{margin:0;color:var(--muted);max-width:120ch}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.empty-card{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:28px;border:1.5px dashed var(--border-strong);border-radius:14px;background:var(--surface)}
.empty-card h2{margin:0;font-size:17px}
.empty-card p{margin:0;color:var(--muted)}
.empty-card .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* inspector */
.inspector{position:relative;width:308px;display:flex;flex-direction:column;min-height:0;background:var(--chrome);border-left:1px solid var(--border);z-index:8}
.app.insp-off .inspector{display:none}
.insp-head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--border)}
.tabs3{display:flex;padding:2px;border-radius:8px;background:var(--surface-2);flex:1}
.tabs3 button{flex:1;border:0;background:transparent;padding:5px 6px;border-radius:6px;color:var(--muted);font-weight:500}
.tabs3 button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.insp-body{flex:1;overflow:auto;padding:4px 0 16px}
.sec{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec h4{margin:0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sel-head{display:flex;align-items:center;gap:10px}
.sel-head .badge{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.sel-head b{display:block;font-size:14px}
.sel-head small{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12px;color:var(--muted)}
.field input[type=text],.field textarea,.field select{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);outline:0}
.field input[type=text]:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:90px;resize:vertical}
.field select option{background:var(--surface);color:var(--fg)}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.range output{font:12px var(--mono);color:var(--muted);min-width:30px;text-align:right}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;cursor:pointer}
.toggle input{appearance:none;width:32px;height:18px;border-radius:999px;background:var(--border-strong);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:16px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper span{min-width:84px;font-variant-numeric:tabular-nums}
.stepper .ib{border:1px solid var(--border);width:28px;height:28px}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act-row .btn{justify-content:center}
.note-mdv{font-size:11.5px;color:var(--faint);line-height:1.45}
.note-mdv code{font:11px var(--mono);color:var(--muted)}
.layers{display:flex;flex-direction:column;gap:1px}
.layer{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:0;background:transparent;text-align:left;width:100%}
.layer:hover{background:var(--hover)}
.layer.on{background:var(--accent-soft)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:90;display:flex;align-items:center;gap:12px;padding:9px 10px 9px 14px;border-radius:10px;

/* design notes */
#pins{position:absolute;inset:0;pointer-events:none;z-index:45}

.notecard{position:fixed;z-index:85;width:min(360px,calc(100vw - 24px));padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:8px}
.notecard h3{margin:0;font-size:14px;display:flex;gap:8px;align-items:center}

.notes-list{display:flex;flex-direction:column;gap:12px}

.notes-list h3 span{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e8590c;color:#fff;font-size:11px;flex:none}

.notes-list p b{color:var(--fg);font-weight:600}
.rules{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--muted)}

}

/* ---------------- design notes ---------------- */
const NOTES = {
  appbar:{n:1, t:"App bar and menus", from:"Google Sheets: the document title above a row of named menus.", now:"MenuBarComponent: a row of unlabelled icons (save, save as, add or remove view, upload, lock, chat, theme, settings).", change:"The same actions, grouped into File, Edit, View, Insert, Data and Help, each with its shortcut. The project title and save state are always visible. Search actions (⌘K) finds any action, view or chart by name.", fixes:"Icons nobody can decode, and shortcuts nobody can discover."},
  toolbar:{n:2, t:"Toolbar that acts on the selection", from:"Sheets and Excel, where the toolbar formats whatever cell is selected.", now:"A DataSourceMenuBar per data source pane, plus seven or eight icons on every chart's title bar.", change:"One toolbar. Undo, Add chart and Tidy up on the left; the selected chart's most-used settings in the middle (colour by, category, column); Reset filters and the inspector toggle on the right.", fixes:"The same icons repeated on every chart, and hunting through dialogs for the setting you change most."},
  filters:{n:3, t:"Filter bar", from:"The spreadsheet formula bar, which always shows what's in the selected cell.", now:"A filter only shows as a small reset icon on the chart that holds it. The datasource bar shows a count, but not why rows are missing.", change:"Every active filter is a chip: which data source, which chart, what it keeps. Click a chip to find the chart; × removes the filter (chart.removeFilter()).", fixes:"'Why is half my data missing?' The answer is always on screen."},
  tools:{n:4, t:"Tool rail", from:"Photoshop's tools palette: pick a tool once, use it anywhere.", now:"Each scatter plot carries its own selection toolbar (SelectionOverlay: Pan, Rectangle, Polygon, Lasso, Modify).", change:"One rail with Select, Lasso, Pan and Zoom. The active tool applies to whichever plot you drag on, and the status bar says what it does. On phones the rail floats at the bottom.", fixes:"Duplicated per-chart toolbars, and modes people don't notice they're in."},
  canvas:{n:5, t:"Snap grid (the layout manager)", from:"A spreadsheet's grid of cells, with Photoshop-style snapping.", now:"'absolute' layout (pixel positions) or gridstack, one per datasource pane. Charts can sit anywhere, overlap, and run off the right edge of the window.", change:"One layout manager owns a 12-column grid for the whole view. A chart covers whole cells, never overlaps another and is never wider than the window. Each chart type has a minimum size. At tablet width the grid has 6 columns and on phones 1; those layouts flow from the desktop layout in reading order and are stored only if you rearrange them. Positions are saved as {x, y, w, h}, the same shape as today's gsposition and gssize.", fixes:"Charts taking whatever space they like, and no responsive layout."},
  inspector:{n:6, t:"Inspector", from:"Photoshop's Properties panel and the Sheets chart editor side panel.", now:"A floating settings dialog per chart, opened from the cog, that sits on top of the charts.", change:"The same settings (chart.getSettings() returns them as GuiSpecs, which SettingsDialogComponent already renders) shown in one docked panel that follows the selection. A Charts tab lists every chart like layers, with hide and lock; a Data tab shows each data source and its filters. On tablets it slides over the canvas; on phones it's a bottom sheet.", fixes:"Settings dialogs covering the chart you're changing, and no overview of what's in a view."},
  views:{n:7, t:"View tabs", from:"Sheet tabs along the bottom of a spreadsheet.", now:"A view drop-down in the top bar.", change:"Views as tabs (ViewManager). + adds a view, double-click renames, right-click duplicates or deletes. On phones the tabs become a drop-down.", fixes:"Views hidden in a menu, and switching between them taking two clicks."},
  status:{n:8, t:"Status bar", from:"Excel's status bar, which counts and sums the selection.", now:"A filtered-row count chip in each datasource pane.", change:"One bar with the rows passing every filter for each data source in the view (DataStore.filterSize), the number of filters, and a one-line hint for the active tool.", fixes:"No single place that says how much data you're looking at."},
};
const RULES = [
  "<b>Nothing sets a chart's size or position except the layout manager.</b> No pixel positions are stored, and charts can't place themselves.",
  "<b>Every chart type declares a minimum and a default size in grid units</b>, so a chart can never be squeezed until it breaks.",
  "<b>While you drag, charts only move.</b> A chart is redrawn (chart.setSize) once, when you let go. Redrawing on every frame of a resize cost 116–168 redraws per gesture in the layout lab.",
  "<b>Tablet and phone layouts flow from the desktop layout</b> and are only stored when someone rearranges them, so a phone never overwrites the desktop arrangement.",
  "<b>Build it in this order:</b> the layout manager with today's chart title bars; then the inspector; then the tool rail and filter bar; then the restyle. Each step is usable on its own.",
];

function run(a, el, arg){
  const id = el?.closest?.(".card")?.dataset.id || el?.dataset?.id || S.selected;
  switch (a) {
    case "menu": openMenu(MENUS[el.dataset.menu], el, el); break;
    case "menu-all": openMenu(Object.entries(MENUS).flatMap(([k, items]) => [{head:k}, ...items]), el, el); break;
    case "undo": undo(); break; case "redo": redo(); break;
    case "add": openAddChart(); break;
    case "add-ds": openAddChart(el.dataset.ds); break;
    case "add-text": addChart("text", "cells", {}, {title:"Notes", text:{heading:"New section", body:"Describe what this group of charts shows."}}); break;
    case "tidy": { const v = curView(), lay = layoutFor(v, G.cols); record(); storeLayout(v, G.cols, compact(tidy(lay, G.cols), G.cols, lockedSet())); renderGrid(); toast("Gaps closed", true); break; }
    case "reset-layout": record(); delete curView().custom[G.cols]; renderGrid(); toast(`${COLNAME[G.cols]} layout reset to desktop order`, true); break;
    case "density": S.density = arg; renderGrid(); renderInspector(); break;
    case "clear-filters": for (const k of Object.keys(S.filters)) if (inView(k)) delete S.filters[k]; filtersChanged(); renderToolbar(); toast("All filters removed"); break;
    case "toggle-insp": if (app.clientWidth <= 1180) S.insp.narrow = !S.insp.narrow; else S.insp.wide = !S.insp.wide; applyInsp(); renderToolbar(); setTimeout(() => renderGrid(), 0); break;
    case "toggle-fbar": S.fbar = !S.fbar; renderFilterbar(); break;

    case "toggle-legend": { const c = selChart(); if (!c) break; record(); c.o.legend = !c.o.legend; requestDraw(c.id); renderToolbar(); renderInspector(); break; }
    case "theme": document.documentElement.dataset.theme = isDark() ? "light" : "dark"; break;
    case "palette": openPalette(); break;
    case "shortcuts": openShortcuts(); break;
    case "notes": S.notes = !S.notes; renderPins(); break;
    case "notes-list": openNotesList(); break;
    case "note": noteCard(el.dataset.key, el); break;
    case "width": S.width = el.dataset.w; document.documentElement.style.setProperty("--frame-w", S.width === "fit" ? "100%" : `${S.width}px`); $$("#widthSeg button").forEach(b => b.setAttribute("aria-pressed", b === el)); break;
    case "tool": setTool(el.dataset.tool); break;
    case "reset-zoom": for (const i of curView().items) if (RT[i]) { RT[i].v = null; requestDraw(i); } toast("Zoom reset on every plot"); break;
    case "itab": S.itab = arg || el.dataset.tab; if (arg) { if (app.clientWidth <= 1180) S.insp.narrow = true; else S.insp.wide = true; applyInsp(); } renderInspector(); break;
    case "card-settings": if (id) select(id); S.itab = "chart"; if (app.clientWidth <= 1180) S.insp.narrow = true; else S.insp.wide = true; applyInsp(); renderInspector(); renderToolbar(); setTimeout(() => { $("#in-title")?.focus(); renderGrid(); }, 0); break;
    case "card-max": if (id) toggleMax(id); break;
    case "card-more": cardMenu(id, el); break;
    case "unfilter": case "unfilter-chip": setFilter(el.dataset.id || id, null); renderToolbar(); break;
    case "goto": select(el.dataset.id, {scroll:true}); break;
    case "sel": select(el.dataset.id, {scroll:true}); break;
    case "hide": toggleHidden(arg || el.dataset.id); break;
    case "lock": toggleLock(arg || el.dataset.id); break;
    case "dup": if (id) duplicate(id); break;
    case "del": if (id) removeChart(id); break;
    case "popout": toast("Opens the chart in its own window, as MDV does today"); break;
    case "info": toast(`${S.charts[id]?.title}: ${TYPES[S.charts[id]?.type]?.desc}`); break;
    case "size": { const d = el.dataset.d; nudge(S.selected, 0, 0, d === "w+" ? 1 : d === "w-" ? -1 : 0, d === "h+" ? 1 : d === "h-" ? -1 : 0); break; }
    case "view": switchView(el.dataset.v); break;
    case "view-add": addView(); break;
    case "view-dup": duplicateView(S.active); break;
    case "view-list": openMenu(S.views.map(v => ({l:v.name, a:"view-go", arg:v.id, chk:() => v.id === S.active})), el, el); break;
    case "view-go": switchView(arg); break;
    case "view-rename": renameView(arg); break;
    case "view-del": deleteView(arg); break;
    case "view-dupe": duplicateView(arg); break;
    case "save": S.dirty = false; renderSaved(); toast("View saved"); break;
    case "saveas": toast("Saves a copy of this view under a new name"); break;
    case "upload": toast("Opens the existing upload dialog"); break;
    case "export": toast("Exports the view as a PNG or SVG"); break;
    case "share": toast("Opens the existing share dialog"); break;
    case "avatar": toast("Account menu"); break;
    case "rename-project": toast("Rename the project here, like a document title"); break;
    case "modal-close": closeModal(); break;
    case "ac-ds": AC.ds = el.dataset.ds; AC.p = {}; renderAddChart(); break;
    case "ac-type": AC.type = el.dataset.type; AC.p = {}; renderAddChart(); break;
    case "ac-next": AC.step++; renderAddChart(); break;
    case "ac-back": AC.step--; renderAddChart(); break;
    case "ac-add": { const p = {}; for (const [k] of TYPES[AC.type].params) { const v = $(`#ac-${k}`)?.value; p[k] = v === "" ? null : v; } const title = $("#ac-title")?.value.trim(); closeModal();
      addChart(AC.type, AC.ds, p, {title:title || undefined, text:AC.type === "text" ? {heading:"New section", body:"Describe what this group of charts shows."} : undefined}); break; }
  }
}
document.addEventListener("click", e => {
  const pin = e.target.closest(".pin"); if (pin) { e.stopPropagation(); run("note", pin); return; }
  const a = e.target.closest("[data-act]");
  if (!a) { if (!e.target.closest(".menu,.notecard")) closeMenus(); return; }
  if (a.closest(".menu")) return;
  if (!["menu","menu-all","card-more","view-list","note"].includes(a.dataset.act)) closeMenus();
  e.stopPropagation(); run(a.dataset.act, a);
});
document.addEventListener("dblclick", e => {
  const tab = e.target.closest(".vtab"); if (tab) { renameView(tab.dataset.v); return; }
  const cv = e.target.closest(".card-body canvas.scatter"); if (cv) { const id = cv.closest(".card").dataset.id; RT[id].v = null; requestDraw(id); return; }
  if (e.target.closest(".card-head") && !e.target.closest("button")) toggleMax(e.target.closest(".card").dataset.id);
});
document.addEventListener("contextmenu", e => {
  const card = e.target.closest(".card"); if (card) { e.preventDefault(); select(card.dataset.id); cardMenu(card.dataset.id, {x:e.clientX, y:e.clientY}); return; }
  const tab = e.target.closest(".vtab"); if (tab) { e.preventDefault(); const vid = tab.dataset.v; openMenu([{l:"Rename", a:"view-rename", arg:vid},{l:"Duplicate", a:"view-dupe", arg:vid, i:"copy"},{sep:1},{l:"Delete view", a:"view-del", arg:vid, i:"trash", danger:1}], {x:e.clientX, y:e.clientY}); }
});
document.addEventListener("input", onBind);
document.addEventListener("change", e => { if (e.target.id === "vsel") { switchView(e.target.value); return; } onBind(e); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#scrim")) { closeModal(); return; } if ($(".menu,.notecard")) { closeMenus(); return; } if (S.maxed) { toggleMax(S.maxed); return; } if (S.selected) { select(null); return; } }
  if (e.target.closest("input,textarea,select,[contenteditable]")) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === "y") { e.preventDefault(); redo(); return; }
  if (mod && k === "k") { e.preventDefault(); openPalette(); return; }
  if (mod && k === "d") { e.preventDefault(); if (S.selected) duplicate(S.selected); return; }
  if (mod && k === "s") { e.preventDefault(); run("save"); return; }
  if (mod && k === "i") { e.preventDefault(); run("toggle-insp"); return; }
  if ($("#scrim") || mod) return;
  if (e.altKey && S.selected && e.key.startsWith("Arrow")) { e.preventDefault(); const d = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]}[e.key];
    if (e.shiftKey) nudge(S.selected, 0, 0, d[0], d[1]); else nudge(S.selected, d[0], d[1], 0, 0); return; }
  const tool = {v:"select", l:"lasso", h:"pan", z:"zoom"}[k]; if (tool) { setTool(tool); return; }
  if (k === "a") { e.preventDefault(); openAddChart(); } else if (k === "t") run("add-text"); else if (k === "f" && S.selected) toggleMax(S.selected);
  else if ((e.key === "Delete" || e.key === "Backspace") && S.selected) removeChart(S.selected); else if (e.key === "?") openShortcuts();
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); } });
canvas.addEventListener("wheel", e => {
  const cv = e.target.closest("canvas.scatter"); if (!cv || !(S.tool === "zoom" || e.ctrlKey || e.metaKey)) return;
  e.preventDefault(); const id = cv.closest(".card").dataset.id, [px, py] = plotPos(e, cv); zoomAt(id, px, py, e.deltaY > 0 ? 1.12 : 1 / 1.12);
}, {passive:false});
canvas.addEventListener("scroll", () => { if (S.maxed) placeMax(); });
grid.addEventListener("pointerdown", e => { if (e.target === grid || e.target.classList.contains("guides")) select(null); });

/* ---------------- boot ---------------- */
function renderAll(){ renderMenubar(); renderStaticButtons(); renderSaved(); renderToolbar(); renderFilterbar(); renderRail(); renderViews(); renderGrid(); renderInspector(); renderStatus(); renderPins(); }
let lastNarrow = null, roT = 0;
new ResizeObserver(() => { cancelAnimationFrame(roT); roT = requestAnimationFrame(() => {
  const narrow = app.clientWidth <= 1180; if (narrow !== lastNarrow) { lastNarrow = narrow; renderToolbar(); renderInspector(); }
  if (!mv) renderGrid(); renderPins(); }); }).observe(canvas);
new MutationObserver(() => { renderStaticButtons(); for (const id of curView().items) if (RT[id]) RT[id].drawn = null; drawAll(); }).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { renderStaticButtons(); drawAll(); });
recomputeFilters(); setTool("select"); applyInsp(); renderAll(); drawAll();
